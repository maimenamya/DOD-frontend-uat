<div class="app-form-group">
  <div class="app-form-group-header">
    <span class="app-label">รายการในแพ็กเกจ</span>
    <ng-content select="[addLineButton]" />
  </div>

  <div class="drink-package-lines">
    @for (row of lines().controls; track $index; let i = $index) {
      <div class="drink-package-line" [formGroup]="row">
        <button
          type="button"
          class="drink-package-line-remove"
          [disabled]="lines().length <= 1"
          (click)="removeLine(i)"
          aria-label="ลบรายการ"
        >
          ✕
        </button>
        <div class="drink-package-line-body">
          <div class="drink-package-line-field">
            <label class="app-label-sm" [attr.for]="'pkg-line-cat-' + i">ประเภท</label>
            <app-custom-dropdown
              [inputId]="'pkg-line-cat-' + i"
              [options]="categoryOptions()"
              [ngModel]="row.controls.categoryId.value"
              (ngModelChange)="onCategoryChange(row, $event)"
              [ngModelOptions]="{ standalone: true }"
              placeholder="เลือกประเภท"
            />
          </div>
          <div class="drink-package-line-field">
            <label class="app-label-sm" [attr.for]="'pkg-line-drink-' + i">เครื่องดื่ม</label>
            <app-custom-dropdown
              [inputId]="'pkg-line-drink-' + i"
              formControlName="drinkId"
              [options]="drinkOptionsForRow(row)"
              placeholder="เลือกเครื่องดื่ม"
            />
            <app-field-error [control]="row.controls.drinkId" label="เครื่องดื่ม" [select]="true" [validated]="validated()" />
          </div>
          <div class="drink-package-line-field drink-package-line-field--qty">
            <label class="app-label-sm" [attr.for]="'pkg-line-qty-' + i">จำนวน</label>
            <input
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              [id]="'pkg-line-qty-' + i"
              formControlName="quantity"
              class="app-input"
              (input)="sanitizeQuantity(row, $event)"
            />
            <app-field-error [control]="row.controls.quantity" [validated]="validated()" label="จำนวน" />
          </div>
        </div>
      </div>
    }
  </div>
</div>
