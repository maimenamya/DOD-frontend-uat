@if (visible()) {
  <div class="app-notification-bell-root" #bellRoot>
    <button
      type="button"
      class="app-btn-menu app-notification-trigger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-haspopup="true"
      aria-label="การแจ้งเตือน"
    >
      แจ้งเตือน
      @if (unreadCount() > 0) {
        <span class="app-notification-badge" aria-hidden="true">
          {{ unreadCount() > 99 ? '99+' : unreadCount() }}
        </span>
      }
    </button>

    @if (menuOpen()) {
      <button
        type="button"
        class="app-notification-backdrop"
        #backdrop
        aria-label="ปิดการแจ้งเตือน"
        (click)="closeMenu()"
      ></button>
      <div class="app-notification-menu" #menu role="menu" (click)="$event.stopPropagation()">
        <div class="app-notification-menu-header">
          <span class="app-notification-menu-title">การแจ้งเตือน</span>
        </div>

        @if (showPushSetup() && pushSetupButtonLabel()) {
          <div class="app-notification-push-box">
            <button
              type="button"
              class="app-btn-primary-sm app-notification-push-btn"
              [disabled]="pushBusy()"
              (click)="onPushSetupClick()"
            >
              {{ pushBusy() ? 'กำลังเปิด...' : pushSetupButtonLabel() }}
            </button>
          </div>
        }

        @if (loading() && items().length === 0) {
          <div class="app-skeleton-list app-skeleton-list--tight" aria-busy="true" aria-label="กำลังโหลด">
            <span></span>
            <span></span>
            <span></span>
          </div>
        } @else if (items().length === 0) {
          <p class="app-notification-empty">ยังไม่มีการแจ้งเตือน</p>
        } @else {
          <ul class="app-notification-list">
            @for (item of items(); track item.id) {
              <li>
                <button
                  type="button"
                  class="app-notification-item"
                  [class.app-notification-item--unread]="!item.isRead"
                  role="menuitem"
                  (click)="openItem(item)"
                >
                  <span class="app-notification-item-title">{{ item.title }}</span>
                  <span class="app-notification-item-body">{{ item.body }}</span>
                  <span class="app-notification-item-meta">{{ item.createdAtLabel }} น.</span>
                </button>
              </li>
            }
          </ul>
        }
      </div>
    }
  </div>
}
