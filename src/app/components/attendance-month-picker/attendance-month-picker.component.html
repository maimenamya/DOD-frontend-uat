<div class="attendance-roster-month-picker">
  <div class="app-form-group">
    <label class="app-label" for="attendance-picker-month">เดือน</label>
    <app-custom-dropdown
      inputId="attendance-picker-month"
      [options]="monthOptions"
      placeholder="เลือกเดือน"
      [ngModel]="pickerMonth()"
      (ngModelChange)="onPickerMonth($event)"
    />
  </div>
  <div class="app-form-group">
    <label class="app-label" for="attendance-picker-year">ปี (พ.ศ.)</label>
    <app-custom-dropdown
      inputId="attendance-picker-year"
      [options]="yearOptions()"
      placeholder="เลือกปี"
      [ngModel]="pickerYear()"
      (ngModelChange)="onPickerYear($event)"
    />
  </div>
</div>
