<app-toast />
<app-confirm-dialog-host />

<div class="app-layout" [class.app-layout--privacy-banner]="showPrivacyConsentBanner()">
  @if (showPrivacyConsentBanner()) {
    <div class="app-privacy-consent-banner" role="status">
      <p class="app-privacy-consent-banner__text">
        มีนโยบายความเป็นส่วนตัวเวอร์ชันใหม่ — กรุณาแจ้งเจ้าของร้านเข้าสู่ระบบเพื่อยอมรับก่อน
        (พนักงานใช้งานต่อได้)
      </p>
      <button
        type="button"
        class="app-privacy-consent-banner__close"
        aria-label="ปิดการแจ้งเตือน"
        (click)="dismissPrivacyBanner()"
      >
        ✕
      </button>
    </div>
  }

  <button
    type="button"
    class="app-mobile-overlay"
    [class.app-mobile-overlay--open]="mobileMenuOpen()"
    [attr.aria-hidden]="!mobileMenuOpen()"
    [attr.tabindex]="mobileMenuOpen() ? 0 : -1"
    aria-label="ปิดเมนู"
    (click)="closeMobileMenu()"
  ></button>

  <div class="app-sidebar-slot">
    <app-sidebar [mobileOpen]="mobileMenuOpen()" (mobileClose)="closeMobileMenu()" />
  </div>

  <div class="app-layout-main">
    <app-header (menuToggle)="toggleMobileMenu()" />

    <main class="app-main-content">
      <router-outlet />
    </main>
  </div>
</div>
