# SonarQube / SonarCloud — frontend (Angular)
# Local: start server from repo root `docker compose -f docker-compose.sonarqube.yml up -d`
# then: npm run sonar
# Set SONAR_TOKEN (and optionally SONAR_HOST_URL) in the environment.

sonar.projectKey=dod-frontend
sonar.projectName=D-rink Frontend
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/environments/environment.prod.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000
